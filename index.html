<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Examination Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         ANIMATED BACKGROUND
    ================================= -->

    <div class="background-effects">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- ================================
         LOGIN PAGE
    ================================= -->

    <section id="loginPage" class="page login-page">

        <div class="login-container">

            <div class="login-brand">

                <div class="brand-icon">
                    📝
                </div>

                <h1>ONLINE EXAMINATION</h1>

                <h2>MANAGEMENT SYSTEM</h2>

                <p>
                    A smart and simple platform for
                    online examinations.
                </p>

            </div>


            <div class="login-card">

                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Login to continue</p>
                </div>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="userName">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="userName"
                            placeholder="Enter your name"
                            autocomplete="off"
                        >

                    </div>


                    <div class="input-group">

                        <label for="userRole">
                            Select Role
                        </label>

                        <select id="userRole">

                            <option value="student">
                                Student
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                        </select>

                    </div>


                    <p id="loginError" class="error-message"></p>


                    <button
                        type="submit"
                        class="btn btn-login"
                    >
                        LOGIN
                        <span>→</span>
                    </button>

                </form>


                <div class="login-footer">
                    <span>SEPM Project</span>
                    <span>•</span>
                    <span>Online Examination System</span>
                </div>

            </div>

        </div>

    </section>



    <!-- ================================
         STUDENT DASHBOARD
    ================================= -->

    <section id="studentDashboard" class="app-page hidden">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="sidebar-logo">
                    📝
                </div>

                <div>
                    <h2>OE SYSTEM</h2>
                    <small>Examination Portal</small>
                </div>

            </div>


            <nav class="sidebar-nav">

                <button
                    class="nav-item active"
                    data-page="studentHome"
                >
                    <span>🏠</span>
                    Dashboard
                </button>


                <button
                    class="nav-item"
                    data-page="studentExams"
                >
                    <span>📝</span>
                    Examinations
                </button>


                <button
