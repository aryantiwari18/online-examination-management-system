<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Examination Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header class="topbar">

    <div class="brand">
        <span class="brand-dot"></span>
        ONLINE EXAMINATION SYSTEM
    </div>

    <div id="headerUser"></div>

</header>


<!-- ============================= -->
<!-- MAIN CONTAINER -->
<!-- ============================= -->

<main class="container">


<!-- ============================= -->
<!-- LOGIN PAGE -->
<!-- ============================= -->

<section id="loginPage" class="page active">

    <div class="glass login-card glow">

        <div class="logo-ring">
            EXAM
        </div>

        <h1>
            Online Examination
        </h1>

        <p class="muted">
            Secure • Timed • Automatic Evaluation
        </p>

        <input
            type="text"
            id="loginName"
            placeholder="Enter your name"
        >

        <select id="loginRole">

            <option value="student">
                Student
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <button
            class="green"
            onclick="login()">

            LOGIN

        </button>

        <p id="loginError" class="error"></p>

    </div>

</section>



<!-- ============================= -->
<!-- ADMIN DASHBOARD -->
<!-- ============================= -->

<section
    id="adminPage"
    class="page"
    style="display:none;"
>

    <div class="page-head">

        <div>

            <h2>
                Admin Dashboard
            </h2>

            <p class="muted">
                Manage examinations and questions
            </p>

        </div>

        <button
            class="red"
            onclick="logout()">

            LOGOUT

        </button>

    </div>


    <!-- ADMIN STATISTICS -->

    <div id="adminStats"></div>


    <!-- ========================= -->
    <!-- EXAM MANAGEMENT -->
    <!-- ========================= -->

    <div class="admin-section">

        <h2>
            📚 Exam Management
        </h2>

        <input
            type="text"
            id="examTitle"
            placeholder="Enter exam title"
        >

        <input
            type="number"
            id="examDuration"
            placeholder="Duration in minutes"
        >

        <button
            class="green"
            onclick="addExam()">

            + CREATE EXAM

        </button>


        <div id="adminExamList"></div>

    </div>



    <!-- ========================= -->
    <!-- QUESTION MANAGEMENT -->
    <!-- ========================= -->

    <div class="admin-section">

        <h2>
            ❓ Question Management
        </h2>


        <!-- SELECT EXAM -->

        <select id="questionExam">

            <option>
                Select Exam
            </option>

        </select>


        <!-- QUESTION -->

        <input
            type="text"
            id="questionText"
            placeholder="Enter question"
        >


        <!-- OPTIONS -->

        <input
            type="text"
            id="optionA"
            placeholder="Option A"
        >

        <input
            type="text"
            id="optionB"
            placeholder="Option B"
        >

        <input
            type="text"
            id="optionC"
            placeholder="Option C"
        >

        <input
            type="text"
            id="optionD"
            placeholder="Option D"
        >


        <!-- CORRECT ANSWER -->

        <select id="correctAnswer">

            <option value="0">
                Correct Answer: A
            </option>

            <option value="1">
                Correct Answer: B
            </option>

            <option value="2">
                Correct Answer: C
            </option>

            <option value="3">
                Correct Answer: D
            </option>

        </select>


        <button
            class="green"
            onclick="addQuestion()">

            + ADD QUESTION

        </button>


        <div id="adminQuestionList"></div>

    </div>

</section>



<!-- ============================= -->
<!-- STUDENT DASHBOARD -->
<!-- ============================= -->

<section
    id="studentPage"
    class="page"
    style="display:none;"
>

    <div class="page-head">

        <div>

            <h2>
                Student Dashboard
            </h2>

            <p class="muted">
                Select an active examination
            </p>

        </div>

        <button
            class="red"
            onclick="logout()">

            LOGOUT

        </button>

    </div>


    <div id="examList"></div>


    <div class="admin-section">

        <h2>
            📊 Attempt History
        </h2>

        <div id="historyList"></div>

    </div>

</section>



<!-- ============================= -->
<!-- EXAM PAGE -->
<!-- ============================= -->

<section
    id="examPage"
    class="page"
    style="display:none;"
>

    <div class="page-head">

        <div>

            <h2>
                Examination
            </h2>

            <p
                id="questionNumber"
                class="muted">
            </p>

        </div>


        <div
            id="timer"
            class="timer">

            30:00

        </div>

    </div>


    <!-- QUESTION -->

    <div class="glass question-card">

        <h2 id="questionText">
        </h2>


        <div id="options">
        </div>


        <div class="question-actions">

            <button
                class="blue"
                onclick="previousQuestion()">

                ← PREVIOUS

            </button>


            <button
                class="blue"
                onclick="nextQuestion()">

                NEXT →

            </button>


            <button
                class="red"
                onclick="submitExam()">

                SUBMIT EXAM

            </button>

        </div>

    </div>

</section>



<!-- ============================= -->
<!-- RESULT PAGE -->
<!-- ============================= -->

<section
    id="resultPage"
    class="page"
    style="display:none;"
>

    <div class="glass result-card glow">

        <div class="result-icon">
            ✓
        </div>

        <h2>
            Exam Completed
        </h2>

        <h1
            id="resultScore">
        </h1>

        <p id="resultDetails">
        </p>

        <button
            class="green"
            onclick="showStudentDashboard()">

            BACK TO DASHBOARD

        </button>

    </div>

</section>


</main>



<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<script src="script.js"></script>

</body>
</html>
